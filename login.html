<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login - Bookmarkly</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body class="auth-page">

    <div class="auth-container">

        <a
            href="index.html"
            class="back-home">

            ← Back Home

        </a>


        <div class="auth-card">

            <div class="logo">
                🔖 Bookmarkly
            </div>


            <h1>
                Welcome Back
            </h1>


            <p>
                Login to manage your saved resources.
            </p>


            <form id="loginForm">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required>


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required>


                <button
                    type="submit"
                    class="primary-btn">

                    Login

                </button>

            </form>


            <p id="loginMessage"></p>


            <div class="auth-switch">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>

        </div>

    </div>


<script src="script.js"></script>

</body>
</html>
