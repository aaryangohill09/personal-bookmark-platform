<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Register - Bookmarkly</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body class="auth-page">

    <div class="auth-container">

        <a
            href="index.html"
            class="back-home">

            ← Back Home

        </a>


        <div class="auth-card">

            <div class="logo">
                🔖 Bookmarkly
            </div>


            <h1>
                Create Account
            </h1>


            <p>
                Start organizing your useful resources.
            </p>


            <form id="registerForm">

                <label>
                    Name
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your name"
                    required>


                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required>


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    required>


                <button
                    type="submit"
                    class="primary-btn">

                    Create Account

                </button>

            </form>


            <p id="registerMessage"></p>


            <div class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>

        </div>

    </div>


<script src="script.js"></script>

</body>
</html>
