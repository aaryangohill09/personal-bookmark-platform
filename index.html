<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmarkly - Personal Bookmark Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            🔖 Bookmarkly
        </div>

        <nav>

            <button class="nav-item active" onclick="showAll()">
                📚 All Bookmarks
            </button>

            <button class="nav-item" onclick="showFavorites()">
                ⭐ Favorites
            </button>

            <button class="nav-item" onclick="showReadLater()">
                📖 Read Later
            </button>

        </nav>


        <!-- COLLECTIONS -->
        <div class="collections">

            <div class="section-title">
                <span>Collections</span>

                <button onclick="openCollectionModal()">
                    +
                </button>
            </div>

            <div id="collectionList"></div>

        </div>


        <button class="dark-btn" onclick="toggleDarkMode()">
            🌙 Dark Mode
        </button>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <!-- TOPBAR -->
        <header class="topbar">

            <div>
                <h1>My Bookmarks</h1>

                <p>
                    Save and organize your favorite resources.
                </p>
            </div>


            <div class="user-area">

                <span id="userName"></span>

                <button
                    id="loginBtn"
                    class="outline-btn"
                    onclick="loginAction()">

                    Login

                </button>

            </div>

        </header>


        <!-- TOOLBAR -->
        <section class="toolbar">

            <div class="search">

                🔍

                <input
                    type="text"
                    id="search"
                    placeholder="Search bookmarks..."
                    oninput="renderBookmarks()">

            </div>


            <select
                id="typeFilter"
                onchange="renderBookmarks()">

                <option value="all">
                    All Types
                </option>

                <option value="website">
                    Website
                </option>

                <option value="article">
                    Article
                </option>

                <option value="video">
                    Video
                </option>

            </select>


            <select
                id="sort"
                onchange="renderBookmarks()">

                <option value="newest">
                    Newest
                </option>

                <option value="oldest">
                    Oldest
                </option>

                <option value="az">
                    A-Z
                </option>

            </select>


            <button
                class="primary-btn"
                onclick="openBookmarkModal()">

                + Add Bookmark

            </button>

        </section>


        <!-- BOOKMARKS -->
        <section
            id="bookmarkContainer"
            class="bookmark-grid">
        </section>


        <!-- EMPTY -->
        <div
            id="emptyState"
            class="empty">

            <div>🔖</div>

            <h2>No bookmarks found</h2>

            <p>
                Add your first bookmark to get started.
            </p>

        </div>

    </main>

</div>


<!-- =========================
     BOOKMARK MODAL
========================= -->

<div
    id="bookmarkModal"
    class="modal">

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="bookmarkModalTitle">
                Add Bookmark
            </h2>

            <button onclick="closeBookmarkModal()">
                ×
            </button>

        </div>


        <form id="bookmarkForm">

            <input
                type="hidden"
                id="bookmarkId">


            <label>Title</label>

            <input
                type="text"
                id="bookmarkTitle"
                placeholder="Bookmark title"
                required>


            <label>URL</label>

            <input
                type="url"
                id="bookmarkUrl"
                placeholder="https://example.com"
                required>


            <label>Description</label>

            <textarea
                id="bookmarkDescription"
                placeholder="Short description">
            </textarea>


            <label>Type</label>

            <select id="bookmarkType">

                <option value="website">
                    Website
                </option>

                <option value="article">
                    Article
                </option>

                <option value="video">
                    Video
                </option>

            </select>


            <label>Collection</label>

            <select id="bookmarkCollection">
            </select>


            <div class="modal-actions">

                <button
                    type="button"
                    class="outline-btn"
                    onclick="closeBookmarkModal()">

                    Cancel

                </button>


                <button
                    type="submit"
                    class="primary-btn">

                    Save Bookmark

                </button>

            </div>

        </form>

    </div>

</div>


<!-- =========================
     COLLECTION MODAL
========================= -->

<div
    id="collectionModal"
    class="modal">

    <div class="modal-box small">

        <div class="modal-header">

            <h2 id="collectionModalTitle">
                New Collection
            </h2>

            <button onclick="closeCollectionModal()">
                ×
            </button>

        </div>


        <form id="collectionForm">

            <input
                type="hidden"
                id="oldCollection">


            <label>
                Collection Name
            </label>

            <input
                type="text"
                id="collectionName"
                placeholder="e.g. Development"
                required>


            <div class="modal-actions">

                <button
                    type="button"
                    class="outline-btn"
                    onclick="closeCollectionModal()">

                    Cancel

                </button>


                <button
                    type="submit"
                    class="primary-btn">

                    Save

                </button>

            </div>

        </form>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
